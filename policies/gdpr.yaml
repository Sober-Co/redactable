# policies/gdpr.yaml
# GDPR-compliant redaction policy for Redactable.
#
# Implements data minimisation (Art. 5(1)(c)), pseudonymisation (Art. 4(5)),
# and security of processing (Art. 32) for all built-in detector types.
#
# References:
#   - EU GDPR 2016/679
#   - Art. 5(1)(c): Data minimisation
#   - Art. 4(5): Pseudonymisation
#   - Art. 9: Special categories of personal data
#   - Art. 25: Data protection by design and by default
#   - Art. 32: Security of processing

version: 1
name: "gdpr"
description: >
  GDPR compliance policy enforcing data minimisation and pseudonymisation.
  Identifiers are masked or redacted, national ID numbers and financial
  data are tokenised (pseudonymised), and high-entropy secrets are scrubbed.

rules:
  # --- Email addresses ---
  # Mask the local part to preserve domain for operational context
  # while minimising personal identifiers (Art. 5(1)(c)).
  - id: email_mask
    field: email
    action: mask
    keep_head: 1
    keep_tail: 0
    mask_glyph: "*"

  # --- Phone numbers ---
  # Redact fully; phone numbers are direct identifiers (Art. 4).
  - id: phone_redact
    field: phone
    action: redact
    replacement: "[REDACTED:PHONE]"

  # --- Credit card numbers ---
  # Tokenise (pseudonymise) to enable analytics without exposing PAN.
  # Art. 4(5) pseudonymisation; also aligns with PCI DSS masking.
  - id: credit_card_tokenise
    field: credit_card
    action: tokenize
    salt: ""

  # --- NHS numbers (UK national ID) ---
  # Tokenise as special category data (Art. 9) to enable record linkage
  # without exposing the original identifier.
  - id: nhs_number_tokenise
    field: nhs_number
    action: tokenize
    salt: ""

  # NHS (legacy detector kind)
  - id: nhs_tokenise
    field: nhs
    action: tokenize
    salt: ""

  # --- US Social Security Numbers ---
  # Redact completely; SSNs are high-sensitivity identifiers.
  # Art. 9 analogy for national identification numbers.
  - id: ssn_us_redact
    field: ssn_us
    action: redact
    replacement: "[REDACTED:SSN]"

  # SSN (legacy detector kind)
  - id: ssn_redact
    field: ssn
    action: redact
    replacement: "[REDACTED:SSN]"

  # --- IBAN bank account numbers ---
  # Tokenise for pseudonymisation; financial identifiers require
  # strong protection under Art. 32 (security of processing).
  - id: iban_tokenise
    field: iban
    action: tokenize
    salt: ""

  # --- High-entropy tokens (API keys, secrets, passwords) ---
  # Redact fully; secrets must never appear in processed output.
  # Art. 32 security of processing.
  - id: high_entropy_redact
    field: high_entropy_token
    action: redact
    replacement: "[REDACTED:SECRET]"
