[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "redactable"
description = "Policy-driven data redaction, masking, and privacy-preserving transformations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sober & Co.", email = "redactable@open.soberandco.dev" }]
keywords = ["privacy", "redaction", "masking", "pii", "gdpr", "pci"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

dynamic = ["version"]

[project.scripts]
redactable = "redactable.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/redactable"]

[tool.ruff]
line-length = 100
select = ["E","F","I","B","UP","SIM"]
